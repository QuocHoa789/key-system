<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Key System Admin</title><script src="https://cdn.tailwindcss.com"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script></head><body class="bg-slate-950 text-slate-100 min-h-screen" x-data="app()" x-init="load()"><main class="max-w-7xl mx-auto p-6"><header class="flex justify-between items-center mb-8"><div><p class="text-cyan-400 text-sm font-semibold tracking-widest">ROBLOX SCRIPT HUB</p><h1 class="text-3xl font-bold">Key Control Center</h1></div><button x-show="logged" @click="logout()" class="px-4 py-2 bg-slate-800 rounded-lg">Logout</button></header><section x-show="!logged" class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6"><h2 class="text-xl font-semibold mb-5">Admin sign in</h2><input x-model="login.username" class="w-full mb-3 p-3 rounded bg-slate-800" placeholder="Username"><input x-model="login.password" type="password" class="w-full mb-4 p-3 rounded bg-slate-800" placeholder="Password"><button @click="signin()" class="w-full bg-cyan-500 text-slate-950 font-bold p-3 rounded">Sign in</button><p class="text-rose-400 mt-3" x-text="error"></p></section><section x-show="logged"><div class="grid md:grid-cols-4 gap-4 mb-6"><template x-for="(v,k) in stats"><div class="bg-slate-900 border border-slate-800 p-5 rounded-xl"><p class="text-slate-400 text-sm capitalize" x-text="k"></p><p class="text-3xl font-bold mt-2" x-text="v"></p></div></template></div><div class="grid lg:grid-cols-3 gap-6"><div class="lg:col-span-1 bg-slate-900 p-5 rounded-xl border border-slate-800"><h2 class="font-bold mb-4">Generate key</h2><input x-model="form.prefix" class="w-full mb-3 p-3 rounded bg-slate-800" placeholder="Prefix"><input x-model="form.expiresAt" type="datetime-local" class="w-full mb-3 p-3 rounded bg-slate-800"><textarea x-model="form.note" class="w-full mb-3 p-3 rounded bg-slate-800" placeholder="Note"></textarea><button @click="createKey()" class="w-full bg-emerald-500 text-slate-950 font-bold p-3 rounded">Create</button><div x-show="newKey" class="mt-4 p-3 bg-emerald-950 text-emerald-300 break-all rounded" x-text="newKey"></div></div><div class="lg:col-span-2 bg-slate-900 p-5 rounded-xl border border-slate-800"><div class="flex gap-3 mb-4"><input x-model="search" @input.debounce.300ms="loadKeys()" class="flex-1 p-3 rounded bg-slate-800" placeholder="Search masked key or note"><select x-model="status" @change="loadKeys()" class="p-3 rounded bg-slate-800"><option value="">All</option><option>active</option><option>disabled</option><option>revoked</option></select></div><div class="overflow-auto"><table class="w-full text-sm"><thead class="text-slate-400 text-left"><tr><th class="p-2">Key</th><th>Status</th><th>HWID</th><th>Expiry</th><th></th></tr></thead><tbody><template x-for="k in keys" :key="k.id"><tr class="border-t border-slate-800"><td class="p-2" x-text="k.key_masked"></td><td x-text="k.status"></td><td x-text="k.hwid ? 'bound' : 'free'"></td><td x-text="k.expires_at || 'never'"></td><td><button @click="reset(k)" x-show="k.hwid" class="text-amber-400 mr-2">Reset</button><button @click="toggle(k)" class="text-cyan-400" x-text="k.status==='active'?'Disable':'Enable'"></button></td></tr></template></tbody></table></div></div></div><div class="mt-6 bg-slate-900 p-5 rounded-xl border border-slate-800"><h2 class="font-bold mb-3">Recent audit events</h2><div class="space-y-2 text-sm"><template x-for="e in events"><div class="flex gap-3"><span class="text-slate-500" x-text="e.ts"></span><span class="text-cyan-300" x-text="e.action"></span><span x-text="e.reason"></span></div></template></div></div></section></main><script>function app(){return{logged:false,error:'',login:{},stats:{},keys:[],events:[],search:'',status:'',form:{prefix:'RBX',note:''},newKey:'',async api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d},async signin(){try{await this.api('/api/admin/login',{method:'POST',body:JSON.stringify(this.login)});this.logged=true;this.load()}catch(e){this.error=e.message}},async load(){try{let d=await this.api('/api/admin/overview');this.logged=true;this.stats=d.stats;this.events=d.events;this.loadKeys()}catch(e){this.logged=false}},async loadKeys(){if(!this.logged)return;let d=await this.api('/api/admin/keys?search='+encodeURIComponent(this.search)+'&status='+this.status);this.keys=d.keys},async createKey(){try{let d=await this.api('/api/admin/keys',{method:'POST',body:JSON.stringify(this.form)});this.newKey=d.key;this.load()}catch(e){alert(e.message)}},async toggle(k){await this.api('/api/admin/keys/'+k.id,{method:'PATCH',body:JSON.stringify({status:k.status==='active'?'disabled':'active'})});this.load()},async reset(k){if(confirm('Reset HWID? This action is audited.')){await this.api('/api/admin/keys/'+k.id+'/reset-hwid',{method:'POST',body:JSON.stringify({reason:'manual admin reset'})});this.load()}},async logout(){await this.api('/api/admin/logout',{method:'POST'});location.reload()}}}</script></body></html>
